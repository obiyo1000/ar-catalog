<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Specification Files</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
  <a href="javascript:history.back()" class="btn btn-secondary mb-3">← กลับ</a>

  <div class="card shadow border-0 rounded-4">
    <div class="card-body p-4">
      <h3 id="title" class="mb-3">Specification</h3>
      <div id="specList"></div>
    </div>
  </div>
</div>

<script src="assets/data/models.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const model = models.find(item => String(item.id) === String(id));

  const title = document.getElementById("title");
  const specList = document.getElementById("specList");

  if (!model) {
    specList.innerHTML = `<div class="alert alert-danger">ไม่พบข้อมูลสินค้า</div>`;
  } else {
    title.innerHTML = model.name + " - Specification";

    const specs = Array.isArray(model.spec) ? model.spec : [model.spec];

    specList.innerHTML = specs.map(file => {
      const fileName = file.split("/").pop();

      return `
        <a href="${file}" target="_blank"
           class="btn btn-outline-success w-100 mb-2 text-start">
          📄 ${fileName}
        </a>
      `;
    }).join("");
  }
</script>

</body>
</html>
